# =============================================================================
# ForgeQA - Pre-Commit Configuration
# =============================================================================
# Install with: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
# =============================================================================

default_language_version:
  python: python3

repos:
  # ---------------------------------------------------------------------------
  # 1. Secret scanning (prevents credential commits)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets

  # ---------------------------------------------------------------------------
  # 2. Basic file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-case-conflict
        name: Check for filename case conflicts
      - id: mixed-line-ending
        name: Normalise line endings
        args: ["--fix=lf"]

  # ---------------------------------------------------------------------------
  # 3. Ruff (lint + format)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        name: Ruff lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff format

  # ---------------------------------------------------------------------------
  # 4. MyPy (type checking)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: MyPy type check
        additional_dependencies:
          - pydantic>=2.14.1
          - pytest>=9.2.0
        args: [--config-file=pyproject.toml]
        files: ^src/

  # ---------------------------------------------------------------------------
  # 5. ADR validation (local script)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: adr-validate
        name: Validate ADRs
        entry: python scripts/adr.py validate
        language: system
        files: ^docs/adr/.*\.md$
        pass_filenames: false
      - id: adr-index
        name: Regenerate ADR index
        entry: python scripts/adr.py index
        language: system
        files: ^docs/adr/.*\.md$
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # 6. Commit message format (Conventional Commits)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        name: Check commit message format
        stages: [commit-msg]
        args: []

name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in ForgeQA.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: "thapelomagqazana"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.
        Before submitting, please search [existing issues](https://github.com/thapelomagqazana/forgeqa/issues) to avoid duplicates.

        **⚠️ Do not report security vulnerabilities here.** See [SECURITY.md](https://github.com/thapelomagqazana/forgeqa/blob/main/SECURITY.md) for the private disclosure process.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I run `pytest`, the fixture raises..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behaviour. Include code snippets if possible.
      placeholder: |
        1. Create a `forgeqa.toml` with...
        2. Run `pytest tests/test_ui.py`
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include the full error message or traceback.
    validations:
      required: true

  - type: input
    id: forgeqa-version
    attributes:
      label: ForgeQA Version
      description: "Run `python -c \"import forgeqa; print(forgeqa.__version__)\"` to get this."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: "Run `python --version` to get this."
      placeholder: "3.12.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other (specify in description)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of ForgeQA does this bug affect?
      options:
        - Configuration
        - UI Adapter (Playwright)
        - API Adapter (HTTPX)
        - Reporting (JUnit XML / JSON)
        - Diagnostics
        - CLI
        - Documentation
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Traceback
      description: Paste any relevant logs, error messages, or traceback. **Redact secrets and sensitive data.**
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates.
          required: true
        - label: I have redacted any secrets or sensitive data from logs.
          required: true
        - label: This is not a security vulnerability (see SECURITY.md).
          required: true

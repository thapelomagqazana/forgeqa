name: ✨ Feature Request
description: Suggest a new feature or enhancement for ForgeQA.
title: "[Feature]: "
labels: ["enhancement", "triage"]
assignees: "thapelomagqazana"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Before submitting, please:
        - Search [existing issues](https://github.com/thapelomagqazana/forgeqa/issues) and [discussions](https://github.com/thapelomagqazana/forgeqa/discussions) for similar ideas.
        - Consider whether this fits the [MVP scope](https://github.com/thapelomagqazana/forgeqa/blob/main/docs/mvp-scope.md).
        - Read the [product requirements](https://github.com/thapelomagqazana/forgeqa/blob/main/docs/product-requirements.md) to understand the project's direction.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve? Describe the pain point, not the solution.
      placeholder: "I spend 3 hours per week investigating flaky tests because..."
    validations:
      required: true

  - type: textarea
    id: current-workaround
    attributes:
      label: Current Workaround
      description: How do you solve this problem today?
      placeholder: "I manually re-run the failed tests and compare logs..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: What would you like ForgeQA to do? Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you tried or considered?
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Related Component
      description: Which part of ForgeQA would this feature affect?
      options:
        - Configuration
        - UI Adapter (Playwright)
        - API Adapter (HTTPX)
        - Reporting (JUnit XML / JSON)
        - Diagnostics
        - CLI
        - Documentation
        - New feature / Other
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected Impact
      description: Who else would benefit from this feature? How significant is the impact?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions for similar ideas.
          required: true
        - label: This feature aligns with the project's direction (see docs/product-requirements.md).
          required: true
        - label: I understand that features are prioritised based on validated user problems, not popularity.
          required: true

# =============================================================================
# ForgeQA Reference Application - pyproject.toml
# =============================================================================
# This is a standalone FastAPI application used as a test target for ForgeQA.
# It is NOT part of the ForgeQA package itself.
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeqa-reference-app"
version = "0.1.0"
description = "Reference application for testing ForgeQA UI and API workflows"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.14.1",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests involving multiple components",
]

# =============================================================================
# ForgeQA - pyproject.toml
# =============================================================================
# Build backend: Hatchling (PEP 517 compatible)
# Python: 3.11+ (Enforced in requires-python)
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project Metadata
# =============================================================================
[project]
name = "forgeqa"
version = "0.1.0"
description = "A reusable, evidence-first Python test automation foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "ForgeQA Maintainer", email = "maintainer@forgeqa.dev" }
]
keywords = [
    "testing",
    "automation",
    "pytest",
    "playwright",
    "httpx",
    "qa",
    "quality-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Core dependencies (always installed).
#
# IMPORTANT: playwright and httpx MUST NOT appear here. They are optional
# dependencies (see [project.optional-dependencies] below) and must only be
# installed when the caller explicitly requests forgeqa[ui] or forgeqa[api].
# Adding either to this list would install it for every consumer, violating
# WBS 1.1.3. Enforced by:
#   - tests/unit/test_dependency_groups.py::
#       test_core_dependencies_do_not_include_optional_deps
#   - scripts/verify_deps.sh (scenario: core)
#
# NOTE: pytest is deliberately a runtime dependency, not an optional
# extra. ForgeQA is a pytest plugin (see [project.entry-points.pytest11]
# below); a pytest11 plugin that is not importable without pytest is not
# a plugin. Keeping `pytest` here is the correct trade-off.
dependencies = [
    "pytest>=9.2.0",
    "pydantic>=2.14.1",
]

# =============================================================================
# Optional Dependency Groups
# =============================================================================
# Per Phase 0.5.3 / WBS 1.1.3, the groups are:
#   ui   -> Playwright only (browser automation)
#   api  -> HTTPX only (HTTP client)
#   dev  -> local development tooling (build, twine, mypy, ruff, ...)
#   all  -> explicit union of ui + api + dev
#
# Invariants enforced by scripts/verify_deps.sh:
#   pip install forgeqa          -> NO  playwright, NO  httpx
#   pip install forgeqa[ui]      -> YES playwright, NO  httpx
#   pip install forgeqa[api]     -> NO  playwright, YES httpx
#   pip install forgeqa[all]     -> YES playwright, YES httpx
#   pip install forgeqa[dev]     -> NO  playwright, NO  httpx  (dev is tooling only)
#
# Rules for contributors (see docs/engineering-standards.md):
#   1. [project].dependencies must never include an optional dependency.
#   2. Each single-purpose extra (ui, api) declares exactly one runtime dep.
#   3. `all` is an explicit union; never a self-reference
#      ("forgeqa[ui,api,dev]").
#   4. Adding a new optional dep requires updating:
#      - this file
#      - tests/unit/test_dependency_groups.py
#      - scripts/verify_deps.sh (new scenario + assertion)
#      - tests/support.py FORBIDDEN_IMPORTS_ON_TOP_LEVEL
#      - README.md "Optional extras" table
[project.optional-dependencies]
ui = [
    "playwright>=1.64.1",
]
api = [
    "httpx>=0.27",
]
dev = [
    "build>=1.2",
    "twine>=5.1",
    "mypy==1.11.2",          # Matches .pre-commit-config.yaml mirrors-mypy rev
    "ruff==0.17.3",          # Matches .pre-commit-config.yaml ruff-pre-commit rev
    "pytest-cov",
    "coverage[toml]",        # Required for pytest-cov to read pyproject.toml config
    "pre-commit",
    "packaging",             # Used by scripts/verify_deps.sh for semantic version comparison
]
# Combine all optional features for local development.
# Explicit list, not a self-reference ("forgeqa[ui,api,dev]"): self-references
# work on modern pip but warn on older resolvers and cannot be statically
# flattened by tooling. Enforced by:
#   tests/unit/test_dependency_groups.py::test_no_self_reference_in_all
all = [
    "playwright>=1.64.1",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=5.1",
    "mypy==1.11.2",
    "ruff==0.17.3",
    "pytest-cov",
    "coverage[toml]",
    "pre-commit",
    "packaging",
]

# =============================================================================
# Pytest plugin registration
# =============================================================================
# Registering under the `pytest11` entry point group makes pytest
# auto-discover this plugin when `forgeqa` is installed in the same
# environment as the `pytest` executable. A consumer does not need to add
# `-p forgeqa.pytest_plugin` to their pytest invocation; installing
# `forgeqa` is enough.
#
# The value on the right is a dotted module path. It must be importable
# without side effects; see `src/forgeqa/pytest_plugin.py`'s module
# docstring for the import-cost contract.
#
# Enforced by:
#   - tests/unit/test_plugin_registration.py::test_pyproject_declares_pytest11_entry_point
#   - tests/integration/plugin/test_plugin_smoke.py (subprocess: --trace-config,
#     --markers, and @pytest.mark.ui with -W error::pytest.PytestUnknownMarkWarning)
#   - docs/adr/ADR-013-register-forgeqa-as-a-pytest11-plugin-with-a-central-marker-manifest.md
#
# IMPORTANT: pytest must remain a [project].dependencies entry (not an
# optional extra). A pytest11 plugin that is not importable without
# pytest is not a plugin. See the comment above `dependencies` at the top
# of this file — it already covers playwright/httpx; this note extends
# the invariant to pytest.
[project.entry-points.pytest11]
forgeqa = "forgeqa.pytest_plugin"

# =============================================================================
# Project URLs
# =============================================================================
[project.urls]
Homepage = "https://github.com/thapelomagqazana/forgeqa"
Documentation = "https://github.com/thapelomagqazana/forgeqa/tree/main/docs"
Repository = "https://github.com/thapelomagqazana/forgeqa"
Issues = "https://github.com/thapelomagqazana/forgeqa/issues"
Changelog = "https://github.com/thapelomagqazana/forgeqa/blob/main/CHANGELOG.md"

# =============================================================================
# Hatchling Build Configuration
# =============================================================================
# Content contracts for the built artifacts (WBS 1.1.4; enforced by
# scripts/verify_build.sh and tests/unit/test_build_config.py):
#
#   WHEEL  (forgeqa-X.Y.Z-py3-none-any.whl)  MUST contain:
#     - forgeqa/__init__.py                    (importable package)
#     - forgeqa-X.Y.Z.dist-info/licenses/LICENSE  (bundled via [project].license)
#     - forgeqa-X.Y.Z.dist-info/METADATA          (auto-generated)
#     - forgeqa-X.Y.Z.dist-info/WHEEL             (auto-generated)
#   WHEEL MUST NOT contain:
#     tests/, docs/, examples/, scripts/, *.egg-info/, __pycache__/, *.pyc
#
#   SDIST  (forgeqa-X.Y.Z.tar.gz)  MUST contain:
#     - src/forgeqa/  (source tree)
#     - tests/        (so downstream can test from sdist)
#     - docs/         (so downstream can read docs offline)
#     - README.md, LICENSE, pyproject.toml
#   SDIST MUST NOT contain:
#     dist/, build/, .venv/, *.egg-info/, __pycache__/, *.pyc
# =============================================================================

[tool.hatch.build.targets.wheel]
# Ship only the package. `packages` narrows selection to src/forgeqa, so
# hatchling already excludes tests/, docs/, etc. The explicit `exclude`
# below makes the invariant auditable here and robust against a future
# change to `packages` (e.g. adding src/forgeqa_tools should not silently
# broaden the selection to include repo-only directories).
packages = ["src/forgeqa"]
exclude = [
    "tests",
    "docs",
    "examples",
    "scripts",
    "*.egg-info",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
# Ship the source tree so downstream consumers can build and test from
# sdist. Include the files that make the sdist self-sufficient; exclude
# build artifacts so a local build does not leak state into the archive.
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/dist",
    "/build",
    "/.venv",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/htmlcov",
    "/**/*.egg-info",
    "/**/__pycache__",
    "/**/*.pyc",
    "/.git",
    "/.github",
    "/artifacts",
]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests involving multiple components",
    "ui: browser-based tests",
    "api: API tests",
    "smoke: essential delivery-confidence tests",
    "slow: tests with longer expected runtime",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Ruff Configuration (Linting & Formatting)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".venv",
    "build",
    "dist",
    "artifacts",
    "examples/reference-app/.venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # Line too long (handled by formatter; not a code quality issue)
]
# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # Allow assert in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# MyPy Configuration (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["src/forgeqa"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# =============================================================================
# ForgeQA - pyproject.toml
# =============================================================================
# Build backend: Hatchling (PEP 517 compatible)
# Python: 3.11+ (Enforced in requires-python)
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# =============================================================================
# Project Metadata
# =============================================================================
[project]
name = "forgeqa"
version = "0.1.0"
description = "A reusable, evidence-first Python test automation foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
    { name = "ForgeQA Maintainer", email = "maintainer@forgeqa.dev" }
]
keywords = [
    "testing",
    "automation",
    "pytest",
    "playwright",
    "httpx",
    "qa",
    "quality-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Core dependencies (always installed)
dependencies = [
    "pytest>=9.2.0",
    "pydantic>=2.14.1",
]

# =============================================================================
# Optional Dependency Groups
# =============================================================================
[project.optional-dependencies]
ui = [
    "playwright>=1.64.1",
]
api = [
    "httpx>=0.27",
]
dev = [
    "build>=1.2",
    "twine>=5.1",
    "mypy",
    "ruff",
    "pytest-cov",
    "coverage[toml]", # Required for pytest-cov to read pyproject.toml config
    "pre-commit",
]
# Combine all optional features for local development
all = [
    "playwright>=1.64.1",
    "httpx>=0.27",
    "build>=1.2",
    "twine>=5.1",
    "mypy",
    "ruff",
    "pytest-cov",
    "coverage[toml]",
    "pre-commit",
]

# =============================================================================
# Project URLs
# =============================================================================
[project.urls]
Homepage = "https://github.com/thapelomagqazana/forgeqa"
Documentation = "https://github.com/thapelomagqazana/forgeqa/tree/main/docs"
Repository = "https://github.com/thapelomagqazana/forgeqa"
Issues = "https://github.com/thapelomagqazana/forgeqa/issues"
Changelog = "https://github.com/thapelomagqazana/forgeqa/blob/main/CHANGELOG.md"

# =============================================================================
# Hatchling Build Configuration
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/forgeqa"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests involving multiple components",
    "ui: browser-based tests",
    "api: API tests",
    "smoke: essential delivery-confidence tests",
    "slow: tests with longer expected runtime",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Ruff Configuration (Linting & Formatting)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".venv",
    "build",
    "dist",
    "artifacts",
    "examples/reference-app/.venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # Line too long (handled by formatter; not a code quality issue)
]
# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # Allow assert in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# =============================================================================
# MyPy Configuration (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["src/forgeqa"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
